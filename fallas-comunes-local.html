<body>
  <header class="topbar">
    <div class="brand"><span class="brand-mark">SF</span><span>SmartFit <small>Prueba local · Fallas comunes</small></span></div>
    <label class="role-control">Simular perfil
      <select id="roleSelect" aria-label="Simular perfil"><option value="Administrador">Administrador</option><option value="Supervisor">Supervisor</option><option value="Técnico">Técnico</option></select>
    </label>
  </header>
  <div class="layout">
    <aside>
      <div class="nav-caption">Menú</div>
      <button class="nav-item active" id="navFailures" type="button">▤ &nbsp; Fallas comunes</button>
      <button class="nav-item" id="navEquipment" type="button" hidden>⚙ &nbsp; Equipo / mantenimiento</button>
      <div class="role-note" id="roleNote"><strong>Administrador</strong><br>Gestiona los textos y tutoriales de todos los equipos.</div>
    </aside>
    <main id="app"></main>
  </div>
  <div class="modal" id="editorModal" hidden>
    <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="editorTitle">
      <header class="dialog-head"><h2 id="editorTitle">Nuevo contenido</h2><button class="btn small" id="closeEditor" type="button" aria-label="Cerrar">×</button></header>
      <div class="dialog-body" id="editorBody"></div>
    </section>
  </div>
  <div class="toast" id="toast" role="status" hidden></div>
  <script src="admin-store.js"></script>
  <script src="supabase-data.js?v=20261102-knowledge-v1"></script>
  <script src="EQU/matrix-catalog.js"></script>
  <script src="EQU/booty-catalog.js"></script>
  <script src="EQU/other-catalogs.js"></script>
  <script>
    (() => {
      "use strict";
      const STORAGE_KEY = "smartfit.common-failures.local-preview.v1";
      const $ = id => document.getElementById(id);
      const routeParams = new URLSearchParams(location.search);
      const requestedRole = routeParams.get("rol");
      const embeddedRole = ["Administrador", "Supervisor", "Técnico"].includes(requestedRole) ? requestedRole : "";
      const embedded = Boolean(embeddedRole);
      const remoteMode = Boolean(embedded && window.SmartFitSupabaseData && sessionStorage.getItem("smartfit.supabase.auth"));
      const esc = value => String(value ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
      const normalize = value => String(value || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLocaleLowerCase("es").trim();
      const roleSelect = $("roleSelect");
      const catalogs = window.BRAND_EQUIPMENT_CATALOGS || {};
      const brands = (() => {
        const stored = window.AdminStore?.listBrands?.() || [];
        const defaults = ["Matrix","Booty Builder","Shua","Ubian","Lifefitness","Hammer Strength","Technogym","Water Rower","Movement","Octane","Relan","Illus","Insumos"];
        const ids = new Set([...Object.keys(catalogs), ...stored.map(item => item.id), "brand-matrix", "brand-booty-builder"]);
        return [...ids].map(id => {
          const known = stored.find(item => item.id === id);
          const name = known?.name || defaults.find(entry => normalize(entry).replace(/[^a-z0-9]/g, "") === id.replace(/^brand-/, "").replace(/[^a-z0-9]/g, "")) || id.replace(/^brand-/, "");
          return {id,name};
        }).sort((a,b) => a.name.localeCompare(b.name,"es"));
      })();
      let role = embeddedRole || "Administrador", section = "home", kind = "failure", editingId = "", editingRecord = null, currentPage = 1, technicianTab = "failure", technicianPage = {failure:1,tutorial:1}, technicianSearch = {failure:"",tutorial:""}, displayedTechTutorials = [], toastTimer;
      let remoteLoaded = false, remoteLoading = false, remoteLoadError = "", existingKnowledgePhotos = [], pendingKnowledgePhotos = [], knowledgeCarousel = null;
      let records = readRecords();
      function readRecords(){try{const parsed=JSON.parse(localStorage.getItem(STORAGE_KEY)||"[]");return Array.isArray(parsed)?parsed:[]}catch{return[]}}

        const tutorials=allTutorials.filter(item=>matches(item,[item.title,item.description,item.brandName,item.equipmentName,item.model,item.url]));
        const pageSize=5,visibleItems=technicianTab==="failure"?failures:tutorials,pageCount=Math.max(1,Math.ceil(visibleItems.length/pageSize));
        technicianPage[technicianTab]=Math.min(technicianPage[technicianTab],pageCount);
        const start=(technicianPage[technicianTab]-1)*pageSize,pageItems=visibleItems.slice(start,start+pageSize);
        displayedTechTutorials=technicianTab==="tutorial"?pageItems:[];
        const libraryContent=technicianTab==="failure"
          ? pageItems.map(item=>`<details class="tech-failure-item"><summary><span class="tech-failure-icon" aria-hidden="true">!</span><span class="tech-failure-copy"><strong>${esc(item.title)}</strong><span>${esc(item.description||item.symptoms||"Ver detalles de esta falla")}</span></span><span class="tech-chevron" aria-hidden="true">›</span></summary><div class="tech-failure-detail"><div class="tech-failure-readonly"><strong>Marca</strong><span>${esc(item.brandName||brandName)}</span></div><div class="tech-failure-readonly"><strong>Modelo</strong><span>${esc(item.model||model)}</span></div><div class="tech-failure-readonly full"><strong>Título de la falla</strong><span>${esc(item.title)}</span></div>${item.description?`<div class="tech-failure-readonly full"><strong>Descripción de la falla</strong><span>${esc(item.description)}</span></div>`:""}${item.symptoms?`<div class="tech-failure-readonly"><strong>Síntomas</strong><span>${esc(item.symptoms)}</span></div>`:""}${item.resolution?`<div class="tech-failure-readonly"><strong>Resolución</strong><span>${esc(item.resolution)}</span></div>`:""}${item.photos?.length?`<div class="tech-failure-readonly full"><strong>Fotografías</strong><div class="knowledge-photo-grid maintenance-image-list" data-knowledge-photo-paths="${esc(JSON.stringify(normalizePhotos(item.photos).map(photo=>photo.path)))}">Abre para cargar las fotografías…</div></div>`:""}</div></details>`).join("")||`<div class="tech-library-empty">${query?"No hay fallas que coincidan con la búsqueda para este equipo.":"No hay fallas comunes registradas para este equipo."}</div>`
          : pageItems.map(item=>`<a class="tech-tutorial-item" href="${esc(item.url||"#")}" target="_blank" rel="noopener"><span class="tech-video-thumb" aria-hidden="true">▶</span><span class="tech-tutorial-copy"><strong>${esc(item.title)}</strong><span>${esc(item.brandName||brandName)} · ${esc(item.model||model)}</span></span><span class="tech-chevron" aria-hidden="true">›</span></a>`).join("")||`<div class="tech-library-empty">${query?"No hay tutoriales que coincidan con la búsqueda para este equipo.":"No hay tutoriales registrados para este equipo."}</div>`;
        const techPagination=visibleItems.length?`<div class="tech-pagination"><span>Mostrando ${start+1} a ${Math.min(start+pageSize,visibleItems.length)} de ${visibleItems.length} resultados</span>${pageCount>1?`<nav aria-label="Paginación de ${technicianTab==="failure"?"fallas":"tutoriales"}"><button type="button" data-tech-page="${technicianPage[technicianTab]-1}" ${technicianPage[technicianTab]===1?"disabled":""}>«</button>${Array.from({length:pageCount},(_,index)=>`<button type="button" data-tech-page="${index+1}" class="${index+1===technicianPage[technicianTab]?"active":""}" aria-current="${index+1===technicianPage[technicianTab]?"page":"false"}">${index+1}</button>`).join("")}<button type="button" data-tech-page="${technicianPage[technicianTab]+1}" ${technicianPage[technicianTab]===pageCount?"disabled":""}>»</button></nav>`:""}</div>`:"";
        $("app").innerHTML=`${embedded?"":`<div class="local-banner"><span aria-hidden="true">ⓘ</span><div><strong>Vista de técnico (simulada).</strong> Solo muestra contenido del equipo seleccionado.</div></div><div class="device-picker"><label>Marca<select id="deviceBrand">${brandOptions(brandId)}</select></label><label>Equipo / modelo<select id="deviceModel">${optionsForBrand(brandId,modelValue)}</select></label></div>`}<div class="tech-library-tabs" role="tablist" aria-label="Contenido de soporte"><button class="tech-library-tab${technicianTab==="failure"?" active":""}" type="button" role="tab" aria-selected="${technicianTab==="failure"}" data-technician-tab="failure">Fallas comunes</button><button class="tech-library-tab${technicianTab==="tutorial"?" active":""}" type="button" role="tab" aria-selected="${technicianTab==="tutorial"}" data-technician-tab="tutorial">Tutoriales</button></div><h2 style="font-size:14px;margin:0 0 8px">${technicianTab==="failure"?"Fallas comunes":"Tutoriales relacionados"}</h2><input class="tech-library-search" id="techLibrarySearch" type="search" autocomplete="off" placeholder="${technicianTab==="failure"?"Buscar por falla, síntoma o código…":"Buscar tutorial por nombre, modelo o código…"}" value="${esc(technicianSearch[technicianTab]||"")}" aria-label="Buscar ${technicianTab==="failure"?"fallas comunes":"tutoriales"}"><div class="tech-library-list">${libraryContent}</div>${techPagination}`;
      };
      const renderEditorBase=renderEditor;
      renderEditor=function(){
        renderEditorBase();
        if(kind==="tutorial"){
          const urlField=$("recordUrl").closest(".cf-editor-field"),grid=urlField.parentElement;
          const thumbnailField=document.createElement("div");thumbnailField.className="cf-editor-field full";thumbnailField.innerHTML=`<label for="recordThumbnail">Miniatura (URL, opcional)</label><input id="recordThumbnail" type="url" maxlength="1000" value="${esc(editingRecord?.thumbnailUrl||"")}" placeholder="https://…">`;
          grid.insertBefore(thumbnailField,urlField);return;
        }
        const grid=$("recordForm").querySelector(".cf-editor-grid"),field=document.createElement("div");field.className="cf-editor-field full";field.innerHTML=`<label>Registro fotográfico (máximo 4)</label><div class="knowledge-photo-tools"><button class="btn" id="knowledgePhotoAdd" type="button">Agregar imágenes (0/4)</button><button class="btn" id="knowledgePhotoCamera" type="button">Usar cámara</button><input id="knowledgePhotoFiles" type="file" accept="image/*" multiple hidden><input id="knowledgePhotoCameraInput" type="file" accept="image/*" capture="environment" hidden></div><div class="knowledge-photo-preview maintenance-image-list" id="knowledgePhotoPreview"></div><p class="knowledge-photo-status" id="knowledgePhotoStatus"></p>`;grid.append(field);
        $("knowledgePhotoAdd").addEventListener("click",()=>$("knowledgePhotoFiles").click());$("knowledgePhotoCamera").addEventListener("click",()=>$("knowledgePhotoCameraInput").click());
        [$("knowledgePhotoFiles"),$("knowledgePhotoCameraInput")].forEach(input=>input.addEventListener("change",async()=>{const capacity=4-existingKnowledgePhotos.length-pendingKnowledgePhotos.length;const selected=[...input.files].slice(0,capacity);input.value="";if(!selected.length)return;for(const file of selected){try{const optimized=await compressKnowledgePhoto(file);pendingKnowledgePhotos.push({blob:optimized.blob,name:file.name||"fotografia",width:optimized.width,height:optimized.height,objectUrl:URL.createObjectURL(optimized.blob)})}catch(error){showToast(error.message)}}renderPhotoPreview()}));
        renderPhotoPreview();
      };
      const openEditorWithPhotos=openEditor;
      openEditor=function(item=null){existingKnowledgePhotos=[];pendingKnowledgePhotos.forEach(photo=>URL.revokeObjectURL(photo.objectUrl));pendingKnowledgePhotos=[];openEditorWithPhotos(item);if(kind==="failure"&&item?.photos?.length){existingKnowledgePhotos=normalizePhotos(item.photos);renderPhotoPreview();signPhotos(existingKnowledgePhotos).then(photos=>{existingKnowledgePhotos=photos;renderPhotoPreview()}).catch(error=>showToast("No se pudieron cargar las fotos: "+error.message))}};
      const saveEditorBase=saveEditor;
      saveEditor=function(event){
        if(remoteMode){event.preventDefault();saveRemoteKnowledge(event);return}
        if(kind!=="tutorial"){if(pendingKnowledgePhotos.length){showToast("Para guardar fotografías debes iniciar sesión y tener Supabase conectado.");return}saveEditorBase(event);return}
        const existingId=editingRecord?.id,oldIds=new Set(records.map(item=>item.id));
        const thumbnailUrl=$("recordThumbnail")?.value.trim()||"";
        saveEditorBase(event);
        const saved=existingId?records.find(item=>item.id===existingId):records.find(item=>!oldIds.has(item.id));
        if(saved){saved.thumbnailUrl=thumbnailUrl;persist();render()}
      };
      async function saveRemoteKnowledge(event){
        const form=event.currentTarget;if(!form?.reportValidity?.())return;
        const brand=brands.find(entry=>entry.id===$("recordBrand").value),[equipmentName,model]=($("recordModel").value||"").split("|||");if(!brand||!equipmentName||!model)return;
        const existing=editingRecord,legacyId=existing?.id||randomUuid(),remoteId=existing?.remoteId||randomUuid(),uploaded=[];
        const record={id:legacyId,remoteId,kind,brandId:brand.id,brandName:brand.name,equipmentName,model,title:$("recordTitle").value.trim(),description:$("recordDescription").value.trim(),url:kind==="tutorial"?$("recordUrl").value.trim():"",thumbnailUrl:kind==="tutorial"?($("recordThumbnail")?.value.trim()||""):"",duration:existing?.duration||"",symptoms:kind==="failure"?$("recordSymptoms").value.trim():"",resolution:kind==="failure"?$("recordResolution").value.trim():"",createdBy:existing?.createdBy||null,photos:[]};
        try{
          for(const photo of pendingKnowledgePhotos){const uploadedPhoto=await window.SmartFitSupabaseData.uploadCommonKnowledgeImage(remoteId,photo.blob,photo.name,{width:photo.width,height:photo.height});uploaded.push(uploadedPhoto)}
          const oldPaths=normalizePhotos(existingKnowledgePhotos).map(photo=>photo.path),newPhotos=[...oldPaths,...uploaded.map(photo=>photo.path)].slice(0,4);
          const saved=await window.SmartFitSupabaseData.saveCommonKnowledgeEntry({...record,legacyId,photos:newPhotos.map(path=>{const match=[...existingKnowledgePhotos,...uploaded].find(photo=>photo.path===path);return{path,name:match?.name||"fotografia",type:match?.type||"image/webp",size:match?.size||0,width:match?.width||null,height:match?.height||null}})});
          const removed=oldPaths.filter(path=>!newPhotos.includes(path));if(removed.length)window.SmartFitSupabaseData.deleteCommonKnowledgeImages(removed).catch(error=>console.warn("No se pudieron liberar fotografías retiradas.",error));
          const mapped=mapKnowledgeRow(saved);records=records.filter(entry=>entry.id!==legacyId);records.unshift(mapped);existingKnowledgePhotos=[];pendingKnowledgePhotos.forEach(photo=>URL.revokeObjectURL(photo.objectUrl));pendingKnowledgePhotos=[];editingRecord=null;editingId="";section="manage";remoteLoaded=true;render();showToast("Contenido guardado y sincronizado.");
        }catch(error){if(uploaded.length)window.SmartFitSupabaseData.deleteCommonKnowledgeImages(uploaded.map(photo=>photo.path)).catch(()=>{});showToast("No se pudo guardar el contenido: "+error.message)}
      }
      const renderTechnicianBase=renderTechnician;
      function youtubeThumbnail(url){
        try{
          const parsed=new URL(url);
          const host=parsed.hostname.replace(/^www\./,"").toLowerCase();
          let id="";
          if(host==="youtu.be")id=parsed.pathname.split("/").filter(Boolean)[0]||"";
          else if(["youtube.com","m.youtube.com","youtube-nocookie.com"].includes(host)){
            id=parsed.searchParams.get("v")||parsed.pathname.match(/^\/(?:embed|shorts|live)\/([^/?]+)/)?.[1]||"";
          }
          return /^[\w-]{11}$/.test(id)?`https://img.youtube.com/vi/${id}/hqdefault.jpg`:"";
        }catch{return ""}
      }
      renderTechnician=function(){
        renderTechnicianBase();
        if(technicianTab!=="tutorial")return;
        document.querySelectorAll(".tech-video-thumb").forEach((thumb,index)=>{
          const tutorial=displayedTechTutorials[index];if(!tutorial)return;
          const thumbnail=tutorial.thumbnailUrl||youtubeThumbnail(tutorial.url||"");
          if(thumbnail){const image=document.createElement("img");image.src=thumbnail;image.alt="";image.loading="lazy";image.onerror=()=>{image.remove();thumb.insertAdjacentText("afterbegin","▶")};thumb.append(image)}
          if(tutorial.duration){const duration=document.createElement("small");duration.textContent=tutorial.duration;thumb.append(duration)}
        });
      };
      $("app").addEventListener("click",event=>{const page=event.target.closest("[data-tech-page]");if(page&&!page.disabled){technicianPage[technicianTab]=Number(page.dataset.techPage)||1;renderTechnician();return}const tab=event.target.closest("[data-technician-tab]");if(tab){technicianTab=tab.dataset.technicianTab;renderTechnician()}});
      $("app").addEventListener("input",event=>{if(event.target.id!=="techLibrarySearch")return;const start=event.target.selectionStart;technicianSearch[technicianTab]=event.target.value;technicianPage[technicianTab]=1;renderTechnician();const next=$("techLibrarySearch");next?.focus();next?.setSelectionRange(start,start)});
      function showToast(message){const el=$("toast");el.textContent=message;el.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.hidden=true,2600)}
      document.addEventListener("click",event=>{const removePhoto=event.target.closest("[data-remove-knowledge-photo]");if(removePhoto){const index=Number(removePhoto.dataset.removeKnowledgePhoto),totalExisting=existingKnowledgePhotos.length;if(index<totalExisting)existingKnowledgePhotos.splice(index,1);else{const pending=pendingKnowledgePhotos[index-totalExisting];if(pending)URL.revokeObjectURL(pending.objectUrl);pendingKnowledgePhotos.splice(index-totalExisting,1)}renderPhotoPreview();return}const photo=event.target.closest("[data-enlarge-image]");if(photo){if(knowledgeCarousel?.openFromTrigger(photo,photo.dataset.enlargeImage,photo.alt))return;$("knowledgeLightboxImage").src=photo.dataset.enlargeImage;$("knowledgeLightboxImage").alt=photo.alt||"Fotografía del registro";$("knowledgeLightbox").hidden=false;return}if(event.target.closest("#knowledgeLightboxClose")||event.target===$("knowledgeLightbox")){knowledgeCarousel?.close();$("knowledgeLightbox").hidden=true;$("knowledgeLightboxImage").removeAttribute("src");return}const contentKind=event.target.closest("[data-manage-kind]");if(contentKind){kind=contentKind.dataset.manageKind;currentPage=1;section="manage";render();return}if(event.target.closest("[data-content-home]")){section="home";render();return}const tab=event.target.closest("[data-kind]");if(tab){kind=tab.dataset.kind;currentPage=1;section="manage";render();return}if(event.target.closest("#newRecord")){openEditor();return}const edit=event.target.closest("[data-edit]");if(edit){openEditor(records.find(item=>item.id===edit.dataset.edit));return}const del=event.target.closest("[data-delete]");if(del){const record=records.find(item=>item.id===del.dataset.delete);if(record&&confirm(`¿Eliminar “${record.title}”?`)){if(remoteMode){window.SmartFitSupabaseData.deleteCommonKnowledgeEntry(record.id,normalizePhotos(record.photos).map(photo=>photo.path)).then(()=>{records=records.filter(item=>item.id!==record.id);render();showToast("Registro eliminado y sincronizado.")}).catch(error=>showToast("No se pudo eliminar: "+error.message));return}records=records.filter(item=>item.id!==record.id);persist();render();showToast("Registro eliminado.")}return}if(event.target===$("editorModal")||event.target.closest("#closeEditor"))closeEditor()});
      document.addEventListener("input",event=>{if(event.target.id==="search"){const selectionStart=event.target.selectionStart;currentPage=1;render();const next=$("search");next?.focus();next?.setSelectionRange(selectionStart,selectionStart)}});
      document.addEventListener("change",event=>{if(event.target.id==="brandFilter"){currentPage=1;const value=$("brandFilter").value;const filter=$("modelFilter");filter.innerHTML=`<option value="*">Todos los modelos</option>`+brands.filter(item=>value==="*"||item.id===value).flatMap(brand=>currentCatalog(brand.id).map(model=>`<option value="${esc(model.model)}">${esc(brand.name)} · ${esc(model.model)}</option>`)).join("");render()}if(event.target.id==="modelFilter"){currentPage=1;render()}if(event.target.id==="deviceBrand"){const model=$("deviceModel");model.innerHTML=optionsForBrand(event.target.value);renderTechnician()}if(event.target.id==="deviceModel")renderTechnician()});
      if(embedded){document.body.classList.add("embedded");roleSelect.value=role;roleSelect.disabled=true;}
      $("roleSelect").addEventListener("change",event=>setRole(event.target.value));$("navFailures").addEventListener("click",()=>{section="home";render()});$("navEquipment").addEventListener("click",()=>{section="equipment";renderTechnician()});$("closeEditor").addEventListener("click",closeEditor);window.addEventListener("storage",event=>{if(event.key===STORAGE_KEY){records=readRecords();render()}if(remoteMode&&event.key==="smartfit.common-knowledge.changed.v1")loadRemoteKnowledge()});window.addEventListener("smartfit:common-failures-preview-updated",()=>{if(remoteMode)return;records=readRecords();render()});document.addEventListener("toggle",async event=>{const details=event.target.closest?.("details.tech-failure-item[open]");if(!details)return;const host=details.querySelector("[data-knowledge-photo-paths]");if(!host||host.dataset.loaded||host.dataset.loading)return;host.dataset.loading="1";try{const paths=JSON.parse(host.dataset.knowledgePhotoPaths||"[]"),urls=await window.SmartFitSupabaseData.getCommonKnowledgeImageUrls(paths);host.replaceChildren(...paths.filter(path=>urls[path]).map((path,index)=>{const image=document.createElement("img");image.src=urls[path];image.alt=`Fotografía ${index+1} del registro`;image.loading="lazy";image.dataset.enlargeImage=image.src;return image}));host.dataset.loaded="1"}catch(error){host.textContent="No se pudieron cargar las fotografías. Comprueba la conexión.";host.dataset.loading=""}},true);$("knowledgeLightboxClose").addEventListener("click",()=>{knowledgeCarousel?.close();$("knowledgeLightbox").hidden=true;$("knowledgeLightboxImage").removeAttribute("src")});window.addEventListener("keydown",event=>{if(event.key==="Escape"&&!$("knowledgeLightbox").hidden){knowledgeCarousel?.close();$("knowledgeLightbox").hidden=true;$("knowledgeLightboxImage").removeAttribute("src")}});window.addEventListener("load",()=>{if(window.SmartFitRecordPhotoCarousel)knowledgeCarousel=window.SmartFitRecordPhotoCarousel.create({overlayId:"knowledgeLightbox",frameId:"knowledgeLightboxFrame",imageId:"knowledgeLightboxImage",downloadButtonId:"knowledgePhotoDownload",viewportId:"knowledgePhotoViewport",trackId:"knowledgePhotoTrack"})},{once:true});setRole(role);if(remoteMode)loadRemoteKnowledge();
    })();
  </script>
  <div class="knowledge-lightbox" id="knowledgeLightbox" hidden><div class="knowledge-lightbox-frame" id="knowledgeLightboxFrame" role="dialog" aria-modal="true" aria-label="Fotografía del registro"><button class="knowledge-lightbox-close" id="knowledgeLightboxClose" type="button" aria-label="Cerrar imagen">×</button><button id="knowledgePhotoDownload" type="button" aria-label="Descargar fotografía" hidden>↓</button><img id="knowledgeLightboxImage" alt=""><div class="record-photo-carousel-viewport" id="knowledgePhotoViewport" hidden><div class="record-photo-carousel-track" id="knowledgePhotoTrack"></div></div></div></div>
