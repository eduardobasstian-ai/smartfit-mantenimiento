<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101116">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./IMG/pwa-180.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SmartFit">
  <link rel="icon" type="image/png" href="IMG/favicon.png">
  <script src="./online-only.js"></script>
  <title>Cambiar contraseña | Smart Fit</title>
  <style>
    :root{color-scheme:dark;--bg:#101116;--panel:#191b22;--input:#111319;--line:#363943;--text:#f5f6f8;--muted:#a9afbd;--accent:#ffb51b;--error:#57232a;--success:#163b31}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#20232d 0,var(--bg) 58%);color:var(--text);font:15px/1.5 Arial,sans-serif;display:grid;place-items:center;padding:24px}
    main{width:min(100%,560px);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:32px;box-shadow:0 24px 80px #0005}
    h1{font-size:25px;margin:0 0 8px}p{color:var(--muted);margin:0 0 24px}.field{display:grid;gap:8px;margin:18px 0}.field label{font-weight:700}.field input{width:100%;height:52px;background:var(--input);border:1px solid var(--line);border-radius:12px;padding:0 14px;color:var(--text);font:inherit}.field input:focus{outline:2px solid var(--accent);border-color:var(--accent)}.help{font-size:13px;color:var(--muted)}
    .message{display:none;padding:12px 14px;border-radius:10px;margin:18px 0}.message.visible{display:block}.message.error{background:var(--error);border:1px solid #873b45;color:#ffd7da}.message.success{background:var(--success);border:1px solid #28664f;color:#c9ffe9}
    .actions{display:flex;gap:10px;margin-top:24px}.button{border:1px solid var(--line);border-radius:11px;padding:13px 18px;background:#22252d;color:var(--text);font-weight:700;font-size:15px;cursor:pointer}.button.primary{background:var(--accent);color:#151515;border-color:var(--accent);flex:1}.button:disabled{opacity:.65;cursor:wait}
    @media(max-width:480px){main{padding:24px 18px}.actions{flex-direction:column}.button.primary{order:-1}}
  </style>
</head>
<body>
  <main>
    <h1>Actualiza tu contraseña</h1>
    <p id="intro">Por seguridad, establece una nueva contraseña para continuar.</p>
    <form id="passwordForm" novalidate>
      <div class="field"><label for="newPassword">Nueva contraseña</label><input id="newPassword" type="password" autocomplete="new-password" minlength="8" required><span class="help">Debe tener al menos 8 caracteres.</span></div>
      <div class="field"><label for="confirmPassword">Confirmar contraseña</label><input id="confirmPassword" type="password" autocomplete="new-password" minlength="8" required></div>
      <div id="message" class="message" role="status" aria-live="polite"></div>
      <div class="actions"><button class="button" id="logoutButton" type="button">Cerrar sesión</button><button class="button primary" id="saveButton" type="submit">Guardar y continuar</button></div>
    </form>
  </main>
  <script>
    (() => {
      const URL = "https://acmcksmiqrfrxopceies.supabase.co";
      const KEY = "sb_publishable_uWaLgff_Xc03iC68QpUUuQ_QkmCLLGy";
      const sessions = ["smartfit.admin.session", "smartfit.site.session", "smartfit.leader.session"];
      let session = null, sessionKey = "";
      for (const key of sessions) {
        try { const value = JSON.parse(sessionStorage.getItem(key) || "null"); if (value?.authId) { session = value; sessionKey = key; break; } } catch (error) {}
      }
      let auth = null;
      try { auth = JSON.parse(sessionStorage.getItem("smartfit.supabase.auth") || "null"); } catch (error) {}
      if (!session || !auth?.access_token) { location.replace("index.html"); return; }
      document.getElementById("intro").textContent = `Hola ${session.name || ""}. Debes crear una contraseña nueva antes de continuar.`;
      const form = document.getElementById("passwordForm"), message = document.getElementById("message"), button = document.getElementById("saveButton");
      function show(type, text) { message.className = `message visible ${type}`; message.textContent = text; }
      form.addEventListener("submit", async event => {
        event.preventDefault();
        const password = document.getElementById("newPassword").value;
        const confirmation = document.getElementById("confirmPassword").value;
        if (password.length < 8) { show("error", "La contraseña debe tener al menos 8 caracteres."); return; }
        if (password !== confirmation) { show("error", "Las contraseñas no coinciden."); return; }
        button.disabled = true;
        try {
          const response = await fetch(`${URL}/functions/v1/admin-manage-user`, {
            method: "POST",
            headers: { apikey: KEY, Authorization: `Bearer ${auth.access_token}`, "Content-Type": "application/json" },
            body: JSON.stringify({ operation: "change_own_password", password })
          });
          const result = await response.json().catch(() => ({}));
          if (!response.ok) throw new Error(result.error || "No se pudo actualizar la contraseña.");
          session.mustChangePassword = false;
          sessionStorage.setItem(sessionKey, JSON.stringify(session));
          document.getElementById("newPassword").value = "";
          document.getElementById("confirmPassword").value = "";
          show("success", "Contraseña actualizada. Abriendo tu panel…");
          const destination = session.role === "Administrador" ? "cpadmin.html" : session.role === "Líder" ? "cplider.html" : "cpsedes.html";
          setTimeout(() => location.replace(destination), 650);
        } catch (error) { show("error", error.message || "No se pudo actualizar la contraseña."); }
        finally { button.disabled = false; }
      });
      document.getElementById("logoutButton").addEventListener("click", () => {
        sessions.forEach(key => sessionStorage.removeItem(key));
        sessionStorage.removeItem("smartfit.supabase.auth");
        location.replace("index.html");
      });
    })();
  </script>
</body>
</html>
