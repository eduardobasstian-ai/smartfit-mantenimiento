name: Publicar sitio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Preparar versión pública
        run: |
          mkdir -p _site/IMG _site/EQU
          cp index.html cpadmin.html cpsedes.html cplider.html change-password.html admin-store.js supabase-auth.js supabase-data.js _site/
          cp IMG/favicon.ico IMG/favicon.png IMG/logo-header.png _site/IMG/
          cp -R EQU/. _site/EQU/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
